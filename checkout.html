<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الشراء - علفي</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2>إتمام الطلب</h2>
    <div class="row">
      <div class="col-lg-8">
        <!-- معلومات الشحن -->
        <div class="card mb-4">
          <div class="card-body">
            <h5>عنوان التوصيل</h5>
            <input type="text" class="form-control mb-3" placeholder="العنوان بالتفصيل">
            <div class="row">
              <div class="col-md-6"><input type="text" class="form-control" placeholder="المدينة"></div>
              <div class="col-md-6"><input type="text" class="form-control" placeholder="رقم الجوال"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5>ملخص الطلب</h5>
            <hr>
            <h4 class="text-success" id="final-total">0 جنيه</h4>
            <button class="btn btn-success w-100 py-3 mt-3">تأكيد الطلب والدفع</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
