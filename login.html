<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - علفي</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-5">
            <h3 class="text-center mb-4">إنشاء حساب جديد</h3>
            
            <div class="mb-3">
              <label>نوع الحساب</label>
              <select class="form-select">
                <option value="buyer">مشتري (مزرعة / تاجر تجزئة)</option>
                <option value="seller">بائع (مصنع / تاجر جملة)</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3"><input type="text" class="form-control" placeholder="الاسم"></div>
              <div class="col-md-6 mb-3"><input type="text" class="form-control" placeholder="رقم الجوال"></div>
            </div>
            <div class="mb-3"><input type="email" class="form-control" placeholder="البريد الإلكتروني"></div>
            <div class="mb-4"><input type="password" class="form-control" placeholder="كلمة المرور"></div>
            
            <button class="btn btn-success w-100 py-3">إنشاء الحساب</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
